[package]
name = "staron"
version = "1.0.0"
edition = "2024"
authors = ["ArimuraSena <i@arimuraromi.com>"]
description = "A tiny, functional GitHub star gate for CLI tools."
license = "GPL-3.0-only"
repository = "https://github.com/biyuehu/staron"
keywords = ["github", "star", "device-flow", "gate"]
exclude = [
  "*.ts",
  "*.json",
  "*.lock",
  "*.yml",
  "scripts/",
  "dist/",
  "node_modules/",
  "tests/*.ts",
  "src/*.ts"
]

[dependencies]
dirs = "7.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
