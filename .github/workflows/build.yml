name: Build

on:
  push:
    branches: [main]
    paths: &paths
      - '**.ts'
      - '**.json'
      - '**.yml'
  pull_request:
    branches: [main]
    paths: *paths

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --no-verify

      - name: Check formatting
        run: bun fix && git diff --exit-code

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify Node and Bun compatibility
        run: |
          node --input-type=module -e "import { gate } from './dist/index.js'; console.log('Node ESM ok')"
          node -e "const { gate } = require('./dist/index.cjs'); console.log('Node CJS ok')"
          bun -e "import { gate } from './dist/index.js'; console.log('Bun ESM ok')"
          bun -e "const { gate } = require('./dist/index.cjs'); console.log('Bun CJS ok')"
